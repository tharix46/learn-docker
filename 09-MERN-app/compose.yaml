services:
  backend:
    build: ./backend
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - frontend-net
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    networks:
      - backend-net
    volumes:
      - mongo-data:/data/db

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
