services:
  backend:
    build: ./backend
    networks:
      - mern-network
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    networks:
      - mern-network
    depends_on:
      - backend

  mongodb:
    image: mongo:latest
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
