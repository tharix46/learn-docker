server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Increase body size for requests with larger payloads
  client_max_body_size 10M;

  # Proxy API requests for records to backend service
  location /record/ {
    proxy_pass http://backend:5050;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_cache_bypass $http_upgrade;
  }

  # Also catch exactly /record (no trailing slash)
  location = /record {
    proxy_pass http://backend:5050;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve static files and fallback to index.html for SPA routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
